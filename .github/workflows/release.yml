name: Package

# 打 tag（如 v0.2.0）或手动触发时构建三平台安装包：
#   Windows → 管理员级 NSIS 安装包（安装时静默装 WinFsp）+ 便携 exe
#             （cmount 挂载需要 cgo，gcc 用 msys2 的 UCRT64）
#   macOS   → 通用包（arm64 + amd64）的 .app 与 .dmg（需 macOS runner）
#   Linux   → deb 包与 tar.gz（amd64 / arm64 原生 runner 矩阵）
#
# 版本号来自 tag（去掉 v 前缀），经 APP_VERSION 注入 Taskfile/mygo.json。
# 产物统一命名为 RcloneDrive-<版本>-<平台>-<架构>[-setup|-portable].<格式>：
# 应用内更新器按资产名匹配（安装版识别 "-setup."/"_setup."，便携版 "-portable"）。
#
# 打 tag 触发时创建/更新对应 GitHub Release 并附加全部产物（含 .sha256
# 校验和，更新器下载前校验用）；手动触发只上传 workflow artifact。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，形如 0.2.0（仅手动触发使用）"
        required: true
        default: "0.2.0"

permissions:
  contents: read

env:
  TASK_VERSION: "3.54.0"

jobs:
  prepare:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: 解析 tag / 手动输入
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag="v${version}"
            publish="false"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            publish="true"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号 ${version} 不是 x.y.z 形式（tag 需要形如 v0.2.0）"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  windows:
    name: Windows 安装包
    needs: prepare
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 MinGW-w64 gcc（cgo / cmount 用）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      # setup-msys2 在 runner 镜像上的安装位置不固定，解析真实路径加入 PATH，
      # 供 cgo 使用（runner 镜像自带多个 gcc，不能盲目全加）。
      - name: 解析 MinGW gcc 路径
        shell: pwsh
        run: |
          $gcc = $null
          foreach ($root in @("C:\msys64", "$env:RUNNER_TEMP\msys64", "$env:RUNNER_TEMP\msys\msys64")) {
            $candidate = Join-Path $root "ucrt64\bin\gcc.exe"
            if (Test-Path $candidate) { $gcc = $candidate; break }
          }
          if (-not $gcc) {
            $gcc = Get-Command gcc -CommandType Application -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty Source
          }
          if (-not $gcc) { throw "未找到 MinGW gcc（msys2 安装位置异常）" }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gcc)
          echo "gcc resolved to: $gcc"

      # Windows runner 不保证自带 NSIS（参照旧项目流水线）：直接 choco 安装
      # （已装则快速跳过）并把安装目录加入 PATH；同时把解析出的路径经
      # MAKENSIS 环境变量交给 Taskfile，双保险。choco 的 nsis 包默认装到
      # C:\Program Files (x86)\NSIS。
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          $makensis = Join-Path $nsisDir 'makensis.exe'
          if (-not (Test-Path $makensis)) { throw "choco 安装后仍未找到 $makensis" }
          & $makensis /VERSION
          echo "MAKENSIS=$makensis" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: 构建并打包
        shell: bash
        run: task package

      - name: 收集产物（更新器按资产名匹配 setup/portable）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/windows-amd64/RcloneDrive Setup ${APP_VERSION} amd64.exe" \
             "dist/RcloneDrive-${APP_VERSION}-windows-amd64-setup.exe"
          cp "build/windows-amd64/RcloneDrive.exe" \
             "dist/RcloneDrive-${APP_VERSION}-windows-amd64-portable.exe"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS 安装包
    needs: prepare
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并打包（通用包 + dmg）
        run: task package:darwin

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in build/darwin-universal/*.dmg; do
            cp "$f" "dist/RcloneDrive-${APP_VERSION}-darwin-universal.dmg"
          done
          ls -l dist
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux 安装包 (${{ matrix.arch }})
    needs: prepare
    # arm64 使用 GitHub 原生 arm runner，避免交叉编译的麻烦
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并打包
        run: task package:linux ARCH=${{ matrix.arch }}

      - name: 收集产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          for f in build/linux-${{ matrix.arch }}/*.deb; do
            cp "$f" "dist/RcloneDrive-${APP_VERSION}-linux-${{ matrix.arch }}.deb"
          done
          for f in build/linux-${{ matrix.arch }}/*.tar.gz; do
            cp "$f" "dist/RcloneDrive-${APP_VERSION}-linux-${{ matrix.arch }}.tar.gz"
          done
          ls -l dist
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [prepare, windows, macos, linux]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建或更新 Release 并附加产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          # 自动更新的完整性校验和：按发行包名各一份（<包名>.sha256），
          # 客户端按本平台的发行包名取对应文件，核对所下载字节的 SHA-256
          (cd dist && for f in RcloneDrive-*; do sha256sum "$f" > "$f.sha256"; done)
          ls -l dist
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "RcloneDrive ${TAG}" --generate-notes
          fi
